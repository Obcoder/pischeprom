name: Verify and deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pischeprom-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare isolated CI environment
        run: install -m 600 .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, openssl, pdo_sqlite, simplexml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check banking PHP style
        run: |
          vendor/bin/pint --test \
            app/Console/Commands/BankReconcileCommand.php \
            app/Console/Commands/BankSberHealthCommand.php \
            app/Console/Commands/BankSberImportSandboxTokensCommand.php \
            app/Console/Commands/BankSberSyncCommand.php \
            app/Domain/Banking \
            app/Http/Controllers/Banking \
            app/Http/Requests/Banking \
            app/Jobs/Banking \
            app/Logging/RedactBankingContext.php \
            app/Models/BankAccount.php \
            app/Models/BankAccountBalanceSnapshot.php \
            app/Models/BankAuditEvent.php \
            app/Models/BankConnection.php \
            app/Models/BankMatchSuggestion.php \
            app/Models/BankOAuthAttempt.php \
            app/Models/BankPaymentOrderDraft.php \
            app/Models/BankSyncError.php \
            app/Models/BankSyncRun.php \
            app/Models/BankTransaction.php \
            app/Models/BankTransactionAllocation.php \
            app/Models/BankTransactionRevision.php \
            app/Notifications/BankingAlertNotification.php \
            app/Policies/BankAuditEventPolicy.php \
            app/Policies/BankConnectionPolicy.php \
            app/Policies/BankPaymentOrderDraftPolicy.php \
            app/Policies/BankTransactionPolicy.php \
            config/banking.php \
            database/migrations/2026_07_24_120000_create_banking_tables.php \
            database/migrations/2026_07_24_120100_add_banking_fields_to_sales_and_entities.php \
            tests/Feature/Banking \
            tests/Unit/Banking

      - name: Check orders PHP style
        run: |
          vendor/bin/pint --test \
            app/Actions/Fortify/CreateNewUser.php \
            app/Http/Controllers/API/OrderController.php \
            app/Http/Controllers/API/UnitController.php \
            app/Http/Controllers/Verwalter.php \
            app/Http/Controllers/Web/CustomerDashboardController.php \
            app/Http/Controllers/Web/CustomerOrderController.php \
            app/Http/Controllers/Web/OrderPageController.php \
            app/Http/Controllers/Web/UnitController.php \
            app/Http/Middleware/HandleInertiaRequests.php \
            app/Http/Resources/OrderResource.php \
            app/Mail/CustomerOrderCreatedMail.php \
            app/Models/Building.php \
            app/Models/Entity.php \
            app/Models/Good.php \
            app/Models/Order.php \
            app/Models/OrderItem.php \
            app/Models/OrderStatus.php \
            app/Models/Unit.php \
            app/Models/User.php \
            app/Services/Entities/UserEntityResolver.php \
            app/Services/Orders/CustomerOrderNotificationService.php \
            app/Services/Orders/OrderWriter.php \
            database/migrations/2025_04_14_213002_add_columns_domain_and_is_in_abuse_i_p_d_b_to_emails_table.php \
            database/migrations/2025_05_02_165318_drop_column_from_manufacturers_table.php \
            database/migrations/2026_01_03_195751_create_permission_tables.php \
            database/migrations/2026_04_26_003946_alter_wiki_thumbnail_column_in_cities_table.php \
            database/migrations/2026_06_27_190000_backfill_good_country_ids_from_names.php \
            database/migrations/2026_06_29_000004_add_geo_point_to_gis_tables.php \
            database/migrations/2026_07_05_000010_create_stock_movements_table.php \
            database/migrations/2026_07_25_130000_normalize_orders_architecture.php \
            tests/Feature/OrderManagementTest.php \
            tests/Feature/RegistrationTest.php \
            tests/TestCase.php

      - name: Check logistics PHP style
        run: |
          vendor/bin/pint --test \
            app/Console/Commands/Logistics*.php \
            app/Enums/Logistics \
            app/Http/Controllers/Controller.php \
            app/Http/Controllers/API/CheckController.php \
            app/Http/Controllers/API/Logistics \
            app/Http/Middleware/EnforceLogisticsAuthorization.php \
            app/Http/Middleware/HandleInertiaRequests.php \
            app/Http/Requests/Logistics \
            app/Http/Resources/CheckResource.php \
            app/Http/Resources/Logistics \
            app/Jobs/Logistics \
            app/Models/Logistics*.php \
            app/Models/Vehicle.php \
            app/Models/Check.php \
            app/Models/City.php \
            app/Models/Entity.php \
            app/Models/User.php \
            app/Policies/Concerns/ChecksLogisticsPermissions.php \
            app/Policies/Logistics*.php \
            app/Providers/AppServiceProvider.php \
            app/Services/Logistics \
            bootstrap/app.php \
            config/logistics.php \
            config/queue.php \
            database/factories/LogisticsTripFactory.php \
            database/factories/VehicleFactory.php \
            database/migrations/2026_07_28_000001_create_logistics_vehicles_table.php \
            database/migrations/2026_07_28_000002_create_logistics_trips_and_expenses_tables.php \
            database/migrations/2026_07_28_000003_create_logistics_city_matrix_tables.php \
            database/migrations/2026_07_28_000004_create_logistics_routing_history_tables.php \
            database/seeders/DatabaseSeeder.php \
            database/seeders/LogisticsExpenseCategorySeeder.php \
            database/seeders/RolesAndPermissionsSeeder.php \
            routes/api.php \
            routes/console.php \
            routes/web.php \
            tests/Feature/Logistics \
            tests/Unit/LogisticsTripMetricsTest.php \
            tests/Unit/LogisticsRoutingSupportTest.php \
            tests/Unit/ValhallaRoutingProviderTest.php

      - name: Run unit, logistics, banking, goods stock, orders, and products tests
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BANKING_ENABLED: 'false'
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          INERTIA_SSR_ENABLED: 'false'
          QUEUE_CONNECTION: sync
          SBER_API_ENABLED: 'false'
          SBER_READ_ONLY: 'true'
          SESSION_DRIVER: array
        run: |
          php artisan test \
            tests/Unit \
            tests/Feature/Logistics \
            tests/Feature/Banking \
            tests/Feature/GoodStockAlertTest.php \
            tests/Feature/PurchaseGoodsStockTest.php \
            tests/Feature/OrderManagementTest.php \
            tests/Feature/RegistrationTest.php \
            tests/Feature/AmeiseProductsPageTest.php \
            --compact

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build client and SSR assets
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build

      - name: Create verified frontend artifact
        run: |
          if find public/build bootstrap/ssr -type l -print -quit | grep -q .; then
            echo "::error::Frontend build must not contain symbolic links."
            exit 1
          fi

          mkdir -p deploy-artifact
          tar -czf deploy-artifact/frontend-build.tar.gz public/build bootstrap/ssr
          (
            cd deploy-artifact
            sha256sum frontend-build.tar.gz > frontend-build.tar.gz.sha256
          )

      - name: Upload frontend artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-${{ github.sha }}
          path: deploy-artifact/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy exact commit
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production

    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified frontend artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: frontend-${{ github.sha }}
          path: deploy-artifact

      - name: Configure pinned SSH host identity
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.USERNAME }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          set -Eeuo pipefail

          for required_name in \
            SSH_HOST SSH_KNOWN_HOSTS SSH_PORT SSH_PRIVATE_KEY SSH_USER TARGET_DIR
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "::error::Required production secret ${required_name} is missing."
              exit 1
            fi
          done

          if [[ ! "$SSH_PORT" =~ ^[0-9]+$ ]] || (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
            echo "::error::PORT must be a valid TCP port."
            exit 1
          fi

          if [[ "$TARGET_DIR" != /* || "$TARGET_DIR" == "/" ]]; then
            echo "::error::TARGET_DIR must be an absolute non-root path."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" >/dev/null

          if ! ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null \
            && ! ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null
          then
            echo "::error::SSH_KNOWN_HOSTS does not contain the configured host."
            exit 1
          fi

      - name: Deploy on the Russian VPS
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.PORT }}
          SSH_USER: ${{ secrets.USERNAME }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          set -Eeuo pipefail

          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp_options=(
            -i "$HOME/.ssh/deploy_key"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh_target="${SSH_USER}@${SSH_HOST}"

          ssh "${ssh_options[@]}" "$ssh_target" true

          remote_dir="$(
            ssh "${ssh_options[@]}" "$ssh_target" \
              'umask 077 && mktemp -d /tmp/pischeprom-deploy.XXXXXXXXXX'
          )"

          if [[ ! "$remote_dir" =~ ^/tmp/pischeprom-deploy\.[A-Za-z0-9]+$ ]]; then
            echo "::error::The VPS returned an invalid temporary directory."
            exit 1
          fi

          cleanup_remote() {
            ssh "${ssh_options[@]}" "$ssh_target" \
              "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT

          scp "${scp_options[@]}" \
            deploy-artifact/frontend-build.tar.gz \
            deploy-artifact/frontend-build.tar.gz.sha256 \
            "${ssh_target}:${remote_dir}/"

          target_dir_base64="$(printf '%s' "$TARGET_DIR" | base64 -w 0)"

          ssh "${ssh_options[@]}" "$ssh_target" \
            "bash -se -- '$target_dir_base64' '$GITHUB_SHA' '$remote_dir/frontend-build.tar.gz'" \
            < scripts/deploy-production.sh
