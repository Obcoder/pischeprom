name: Validate logistics GIS operations

on:
  pull_request:
    paths:
      - '.github/workflows/routing.yml'
      - '.github/workflows/yandex-cloud-preflight.yml'
      - '.github/workflows/yandex-storage.yml'
      - 'infrastructure/logistics-gis/**'
      - 'app/Services/Logistics/Map/**'
      - 'config/logistics.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistics-gis-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static checks only
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate operational scripts
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find infrastructure/logistics-gis -type f -name '*.sh' -print0)
          php -l infrastructure/logistics-gis/scripts/calculate-preflight.php
          php -l infrastructure/logistics-gis/scripts/validate-map-assets.php
          infrastructure/logistics-gis/tests/preflight-calculator-test.sh
          infrastructure/logistics-gis/tests/map-assets-validator-test.sh
          infrastructure/logistics-gis/tests/private-listen-test.sh
          infrastructure/logistics-gis/tests/range-cors-test.sh
          infrastructure/logistics-gis/tests/application-state-bundle-test.sh
          infrastructure/logistics-gis/tests/map-activation-test.sh
          infrastructure/logistics-gis/tests/object-storage-publisher-test.sh
          infrastructure/logistics-gis/tests/yandex-storage-bootstrap-test.sh
          infrastructure/logistics-gis/tests/yandex-builder-manager-test.sh
          infrastructure/logistics-gis/tests/builder-pipeline-test.sh

      - name: Enforce the manual-build boundary
        run: |
          set -Eeuo pipefail
          if grep -R -n -E 'download-russia-pbf|build-valhalla|build-pmtiles|activate-release' .github/workflows --exclude='routing.yml'; then
            echo 'Heavy GIS operations must never run from GitHub Actions or the standard deploy.' >&2
            exit 1
          fi
          if grep -n -E 'download-russia-pbf|build-valhalla|build-pmtiles|activate-release' scripts/deploy-production.sh; then
            echo 'Heavy GIS operations must never run from the standard production deploy script.' >&2
            exit 1
          fi
          if grep -R -n -E 'docker|docker compose' infrastructure/logistics-gis/scripts; then
            echo 'The all-Russia GIS workflow must remain native and Docker-free.' >&2
            exit 1
          fi

  toolchain:
    name: Pinned Linux toolchain smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install host prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends php-cli python3-venv

      - name: Install and verify pinned native tools
        run: |
          set -Eeuo pipefail
          sudo infrastructure/logistics-gis/scripts/install-gis-toolchain.sh
          sudo infrastructure/logistics-gis/scripts/install-gis-toolchain.sh
          sudo infrastructure/logistics-gis/scripts/install-map-assets.sh /opt/pischeprom-map-assets
          sudo infrastructure/logistics-gis/scripts/install-map-assets.sh /opt/pischeprom-map-assets

          config="${RUNNER_TEMP}/valhalla.json"
          valhalla_build_config \
            --mjolnir-tile-dir "${RUNNER_TEMP}/tiles" \
            --mjolnir-tile-extract "${RUNNER_TEMP}/tiles.tar" \
            > "$config"
          CONFIG="$config" php -r '
            $value=json_decode((string)file_get_contents(getenv("CONFIG")),true,flags:JSON_THROW_ON_ERROR);
            if(($value["mjolnir"]["tile_dir"]??null)!==getenv("RUNNER_TEMP")."/tiles")exit(1);
          '
          php infrastructure/logistics-gis/scripts/validate-map-assets.php \
            /opt/pischeprom-map-assets
          test "$(sha256sum /opt/planetiler/planetiler.jar | awk '{print $1}')" = \
            'f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d'

# This workflow intentionally performs no PBF download, graph/PMTiles build,
# production transfer, service restart, or release activation. Those operations
# require an explicit production-host preflight and a supervised maintenance run.
