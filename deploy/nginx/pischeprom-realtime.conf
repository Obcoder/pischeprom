# Managed by scripts/provision-production-realtime.sh.
# Only the client WebSocket endpoint is public. Reverb's signed publishing API
# (/apps) is available to the application exclusively on the loopback listener.
location ^~ /realtime/app/ {
    proxy_pass http://127.0.0.1:8085/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

location = /realtime {
    return 404;
}

location ^~ /realtime/ {
    return 404;
}
